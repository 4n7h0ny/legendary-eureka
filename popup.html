<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Audio Downloader</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px 14px;
        min-width: 260px;
        color: #1f2933;
        background: #ffffff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 6px 0;
      }
      p {
        font-size: 12px;
        margin: 0 0 10px 0;
        line-height: 1.4;
        color: #52606d;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #0f766e;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0f766e;
      }
    </style>
  </head>
  <body>
    <h1>ChatGPT Audio Downloader</h1>
    <p>
      Click “Read aloud” on any ChatGPT response and use the new “Download Audio”
      button next to the speaker icon to save the audio locally.
    </p>
    <div class="status" id="status">
      <span class="dot"></span>
      <span>Listening for audio…</span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
